name: multica

services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: multica-backend:src
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-devbox-src}
        COMMIT: ${COMMIT:-source}
        DATE: ${DATE:-unknown}
        GOPROXY: https://goproxy.cn,direct
        GOSUMDB: "off"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "10.37.16.72:18081:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://multica:${POSTGRES_PASSWORD:-multica}@postgres:5432/multica?sslmode=disable
      PORT: "8080"
      METRICS_ADDR: 
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: http://10.37.16.72:3000
      CORS_ALLOWED_ORIGINS: 
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}
      GOOGLE_CLIENT_ID: 
      GOOGLE_CLIENT_SECRET: 
      GOOGLE_REDIRECT_URI: http://10.37.16.72:3000/auth/callback
      S3_BUCKET: 
      S3_REGION: us-west-2
      AWS_ENDPOINT_URL: 
      ATTACHMENT_DOWNLOAD_MODE: auto
      ATTACHMENT_DOWNLOAD_URL_TTL: 30m
      CLOUDFRONT_DOMAIN: 
      CLOUDFRONT_KEY_PAIR_ID: 
      CLOUDFRONT_PRIVATE_KEY: 
      COOKIE_DOMAIN: 
      APP_ENV: ${APP_ENV:-production}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      MULTICA_APP_URL: http://10.37.16.72:3000
      MULTICA_PUBLIC_URL: http://10.37.16.72:18081
      ALLOW_SIGNUP: true
      ALLOWED_EMAILS: 
      ALLOWED_EMAIL_DOMAINS: 
      DISABLE_WORKSPACE_CREATION: 
      GITHUB_APP_SLUG: 
      GITHUB_WEBHOOK_SECRET: 
      MULTICA_LARK_SECRET_KEY: 
      MULTICA_LARK_HTTP_BASE_URL: 
      MULTICA_LARK_CALLBACK_BASE_URL: 
    restart: unless-stopped

  frontend:
    image: multica-web:src
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        REMOTE_API_URL: http://backend:8080
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_VERSION: devbox-src
    depends_on:
      - backend
    ports:
      - "10.37.16.72:3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
    volumes:
      - ./apps/web/public/downloads:/app/apps/web/public/downloads:ro
      - ./apps/web/public/downloads.html:/app/apps/web/public/downloads.html:ro
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:
